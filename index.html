<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نانوایی کلاسیک تهران</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Vazirmatn"; background:#F4F4F2; color:#0A0A0A; margin:0; padding:2rem; max-width:800px; margin:auto; }
    [data-theme=dark] body { background:#0A0A0A; color:#F4F4F2; }
    h1 { font-size:2.5rem; }
    .menu { display:grid; gap:1rem; margin:2rem 0; }
    .item { border-bottom:1px solid #E2E2E0; padding:1rem 0; }
    .btn { background:#0A0A0A; color:#F4F4F2; padding:0.8rem 1.5rem; border:none; border-radius:4px; }
  </style>
</head>
<body>
  <button onclick="document.body.toggleAttribute('data-theme') || document.documentElement.setAttribute('data-theme','dark')">تم</button>
  <h1>نانوایی کلاسیک تهران</h1>
  <p>نان سنتی ایرانی با خمیر مادر و آرد حجری. از ۱۳۶۵.</p>
  <div class="menu">
    <div class="item"><strong>نان بربری</strong> — ۱۵,۰۰۰ تومان</div>
    <div class="item"><strong>نان سنگک</strong> — ۱۲,۰۰۰ تومان</div>
    <div class="item"><strong>نان تفتون</strong> — ۱۸,۰۰۰ تومان</div>
  </div>
  <button class="btn">سفارش آنلاین</button>
  <p>آدرس: خیابان انقلاب، تهران</p>
</body>
</html>
